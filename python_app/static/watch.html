<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TL;DR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/watch.js?v=4" defer></script>
</head>
<body class="app">
    <nav class="topbar">
        <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle history" aria-label="Toggle history">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h9"/></svg>
        </button>
        <a href="/" class="brand" aria-label="TL;DR home"><span class="brand-mark" aria-hidden="true"></span>TL;DR</a>
        <a href="/" class="btn-ghost new-video"><span aria-hidden="true">+</span> New video</a>
    </nav>

    <div class="main-container" id="main-container">
        <aside id="history-sidebar">
            <div class="sidebar-header">Library</div>
            <ul id="history-list"></ul>
        </aside>
        <div class="scrim" id="scrim"></div>

        <section class="video-container">
            <div class="player">
                <iframe id="youtubePlayer" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <p id="video-channel" class="video-channel"></p>
            <h1 id="video-title" class="video-title"></h1>
        </section>

        <main class="chat-container">
            <div class="chat-header">
                <div>
                    <h2>Notes</h2>
                    <p class="sub">Sourced from the transcript only</p>
                </div>
                <button id="download-pdf-btn" class="btn-ghost" title="Download notes as PDF">Export PDF</button>
            </div>
            <div id="chat-history" class="chat-history"></div>
            <div id="transcript-loader" class="loader">Loading transcript…</div>
            <div id="suggestions" class="suggestions hidden">
                <button type="button">What are the key takeaways?</button>
                <button type="button">Explain it simply</button>
                <button type="button">Any action items?</button>
            </div>
            <div class="chat-input-area">
                <textarea id="chat-input" placeholder="Ask the video a question" rows="1" disabled></textarea>
                <button id="send-chat-btn" class="send-btn" disabled aria-label="Send"><span aria-hidden="true">↵</span></button>
            </div>
            <p id="chat-error" class="form-error hidden"></p>
        </main>
    </div>
</body>
</html>
