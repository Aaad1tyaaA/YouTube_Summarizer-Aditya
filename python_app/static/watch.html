<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch &amp; Chat · YouTube TLDR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/watch.js?v=3" defer></script>
</head>
<body class="app">
    <nav class="topbar">
        <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle history" aria-label="Toggle history">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <a href="/" class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg></span>
            YouTube <b>TLDR</b>
        </a>
        <a href="/" class="btn-ghost new-video">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
            New video
        </a>
    </nav>

    <div class="main-container" id="main-container">
        <aside id="history-sidebar">
            <div class="sidebar-header">History</div>
            <ul id="history-list"></ul>
        </aside>
        <div class="scrim" id="scrim"></div>

        <section class="video-container">
            <div class="player">
                <iframe id="youtubePlayer" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <h1 id="video-title" class="video-title"></h1>
            <p id="video-channel" class="video-channel"></p>
        </section>

        <main class="chat-container">
            <div class="chat-header">
                <div>
                    <h2>Summary &amp; chat</h2>
                    <p class="sub">Answers come only from this video's transcript</p>
                </div>
                <button id="download-pdf-btn" class="btn-ghost" title="Download chat as PDF">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
                    PDF
                </button>
            </div>
            <div id="chat-history" class="chat-history"></div>
            <div id="transcript-loader" class="loader">Loading transcript…</div>
            <div id="suggestions" class="suggestions hidden">
                <button type="button">What are the key takeaways?</button>
                <button type="button">Explain it like I'm 12</button>
                <button type="button">List any action items</button>
            </div>
            <div class="chat-input-area">
                <textarea id="chat-input" placeholder="Ask anything about this video…" rows="1" disabled></textarea>
                <button id="send-chat-btn" class="send-btn" disabled aria-label="Send">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
                </button>
            </div>
            <p id="chat-error" class="form-error hidden"></p>
        </main>
    </div>
</body>
</html>
