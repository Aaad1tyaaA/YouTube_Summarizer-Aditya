<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTubeTLDR (Python Version) - Input</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/script.js" defer></script>
</head>
<body>
    <header>
        <h1>🎬 YouTube TLDR (Python)</h1>
    </header>
    <main>
        <div class="container">
            <label for="apiKey">🔑 Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Enter your Gemini API Key" />
            
            <label for="url">📺 YouTube Video URL</label>
            <input type="text" id="url" placeholder="Paste YouTube URL here..." />
            
            <label for="prompt">🧠 Initial Summary Prompt (Optional)</label>
            <textarea id="prompt" rows="5">You are an expert video summarizer specializing in creating structured, accurate overviews. Given a YouTube video transcript, extract and present the most crucial information in an article-style format. Prioritize fidelity to the original content, ensuring all significant points, arguments, and key details are faithfully represented. Organize the summary logically with clear, descriptive headings and/or concise bullet points. For maximum skim-readability, bold key terms, core concepts, and critical takeaways within the text. Eliminate advertisements, sponsorships, conversational filler, repeated phrases, and irrelevant tangents, but retain all essential content.</textarea>
            
            <button id="processBtn">Process Video</button>
            <p id="error-message" class="hidden"></p> 
        </div>
    </main>
</body>
</html>
